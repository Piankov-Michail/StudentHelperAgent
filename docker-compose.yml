version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: videos_agent_db
    environment:
      POSTGRES_USER: videos_agent
      POSTGRES_PASSWORD: your_secure_password_here
      POSTGRES_DB: videos_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videos_agent"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network
  
  app:
    build: .
    container_name: videos_agent_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./temp_uploads:/app/temp_uploads
      - ./uploads:/app/uploads
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data: