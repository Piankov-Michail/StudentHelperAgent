version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: videos_agent_db
    environment:
      POSTGRES_USER: videos_agent
      POSTGRES_PASSWORD: your_secure_password_here
      POSTGRES_DB: videos_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videos_agent"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network
  
  neo4j:
    image: neo4j:5.15-community
    container_name: videos_agent_neo4j
    environment:
      NEO4J_AUTH: neo4j/your_neo4j_password_here
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_max__size: 2G
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p your_neo4j_password_here 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network
  
  app:
    build: .
    container_name: videos_agent_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-your_neo4j_password_here}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - DEFAULT_MODEL=${DEFAULT_MODEL}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./temp_uploads:/app/temp_uploads
      - ./uploads:/app/uploads
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs: